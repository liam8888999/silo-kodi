name: Build Kodi repository packages

on:
  push:
    branches:
      - master
      - fix/missing-directory-artwork
    paths:
      - "repo/**"
      - "_repo_generator.py"
      - ".github/workflows/build-kodi-repository.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate add-on ZIPs and repository indexes
        run: python _repo_generator.py

      - name: Commit generated repository files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/zips
          if git diff --cached --quiet; then
            echo "Repository package files are already up to date."
          else
            git commit -m "Build Kodi repository packages"
            git push
          fi
