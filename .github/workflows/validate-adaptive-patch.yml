name: Temporary Python syntax validation

on:
  push:
    branches:
      - fix/adaptive-quality-false-stalls-progress-retry

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile add-on Python files
        run: |
          python -m py_compile repo/plugin.video.silo/main.py repo/plugin.video.silo/resources/lib/silo.py
      - name: Validate add-on XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("repo/plugin.video.silo/addon.xml")
          ET.parse("repo/plugin.video.silo/resources/settings.xml")
          print("Add-on XML is valid")
          PY
